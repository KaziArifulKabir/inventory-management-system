<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | InventoryPro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="loginSection" class="login-overlay">
    <div class="login-card">
      <h2>Inventory<span>Pro</span></h2>

      <div id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button onclick="login()">Access Dashboard</button>
        <p class="tiny" id="loginMessage"></p>
        <p><a href="#" onclick="showRegister()">Create an account</a></p>
      </div>

      <div id="registerForm" style="display:none;">
        <h3>Register</h3>
        <input type="text" id="regOwnerName" placeholder="Owner Name" />
        <input type="text" id="regShopName" placeholder="Shop Name" />
        <input type="email" id="regEmail" placeholder="Gmail" />
        <input type="text" id="regUsername" placeholder="Username" />
        <input type="text" id="regUserid" placeholder="User ID (unique login ID)" />
        <input type="password" id="regPassword" placeholder="Password" />
        <button onclick="register()">Register</button>
        <p class="tiny" id="registerMessage"></p>
        <p><a href="#" onclick="showLogin()">Already have account? Login</a></p>
      </div>
    </div>
  </section>

  <script>
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
    }

    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!username || !password) {
        document.getElementById('loginMessage').innerText = 'Both fields are required';
        return;
      }
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('loginMessage').innerText = data.message;
      }
    }

    async function register() {
      const owner_name = document.getElementById('regOwnerName').value.trim();
      const shop_name = document.getElementById('regShopName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const user_id = document.getElementById('regUserid').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!username || !user_id || !email || !password) {
        document.getElementById('registerMessage').innerText = 'All fields required';
        return;
      }
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ owner_name, shop_name, email, username, user_id, password })
      });
      const data = await res.json();
      document.getElementById('registerMessage').innerText = data.message;
      if (data.success) {
        showLogin();
      }
    }
  </script>
</body>
</html>
